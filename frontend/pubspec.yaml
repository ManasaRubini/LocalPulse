name: localpulse
description: Community Issue Reporting App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5
  provider: ^6.1.2
  geolocator: ^14.0.2
  intl: ^0.19.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geocoding: ^4.0.0
  flutter_map_marker_cluster: ^8.2.2
  url_launcher: ^6.3.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true